name: Optional experimental Control Center IPKs

on:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: 'Exact 40-hex source commit for manual full suite (empty uses selected branch head)'
        required: false
        type: string
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'tests/test_ipk.py'
      - 'tests/test_panel_manifest.py'
      - 'tests/test_panel_ipk_service.sh'
      - 'tests/test_panel_selfupdate_service.sh'
      - '.github/workflows/web-ipk.yml'
      - '!web/control-center/**/*.md'
  push:
    branches:
      - 'feat/kas-web-ipk-panel'
    paths:
      - 'web/control-center/**'
      - 'tests/test_ipk.py'
      - 'tests/test_panel_manifest.py'
      - 'tests/test_panel_ipk_service.sh'
      - 'tests/test_panel_selfupdate_service.sh'
      - '.github/workflows/web-ipk.yml'
      - '!web/control-center/**/*.md'

permissions:
  contents: read

# Cancel superseded PR smoke tests; never cancel manually approved full suites.
concurrency:
  group: web-ipk-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
      - name: Inspect actual archives and isolated maintainer hooks
        run: |
          scripts/verify-entware-opkg.sh --output "$RUNNER_TEMP/entware-opkg"
          chmod 700 "$RUNNER_TEMP/entware-opkg"
          KAS_TEST_OPKG="$RUNNER_TEMP/entware-opkg" python3 tests/test_ipk.py -v
          python3 tests/test_panel_manifest.py -v
          for file in tests/test_panel_ipk_service.sh web/control-center/packaging/*.sh web/control-center/packaging/S98kas-control-center; do
            sh -n "$file"
            dash -n "$file"
          done
  service-lifecycle:
    # Manual-only: expensive native/IPK release qualification, not PR smoke.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: web/control-center/go.sum
      - name: Build native Go fixture and verify official Entware opkg
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (cd web/control-center && go generate ./... && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/kas-control-center-native" .)
          scripts/verify-entware-opkg.sh --output "$RUNNER_TEMP/entware-opkg"
          chmod 700 "$RUNNER_TEMP/entware-opkg"
      - name: Actual opkg MT update, no-op and modified conffiles (disposable offline root)
        run: |
          cd web/control-center
          KAS_TEST_OPKG="$RUNNER_TEMP/entware-opkg" go test -count=1 -run '^(TestMTRealOPKG|TestPanelRealOPKGVersion)' -v .
      - name: Real opkg and init lifecycle on disposable Ubuntu VM (not router or ABI acceptance)
        run: |
          sudo env KAS_SERVICE_LAB=1 GITHUB_ACTIONS=true \
            sh tests/test_panel_ipk_service.sh \
            "$RUNNER_TEMP/kas-control-center-native" "$RUNNER_TEMP/entware-opkg" "$SOURCE_SHA"
  selfupdate-lifecycle:
    # Manual-only: expensive native/IPK release qualification, not PR smoke.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: package-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: web/control-center/go.sum
      - name: Build two native aarch64 panel versions and verify official Entware opkg
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (cd web/control-center && go generate ./... \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath \
                 -ldflags "-X main.panelBuildVersion=0.0.0~selftest-1 -X main.panelBuildSHA=$SOURCE_SHA -X main.panelBuildChannel=experimental" \
                 -o "$RUNNER_TEMP/kas-panel-old" . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath \
                 -ldflags "-X main.panelBuildVersion=0.0.0~selftest-2 -X main.panelBuildSHA=$SOURCE_SHA -X main.panelBuildChannel=experimental" \
                 -o "$RUNNER_TEMP/kas-panel-new" . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath \
                 -ldflags "-X main.panelBuildVersion=0.0.1-1 -X main.panelBuildSHA=$SOURCE_SHA -X main.panelBuildChannel=stable" \
                 -o "$RUNNER_TEMP/kas-panel-stable" .)
          curl --fail --location --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://bin.entware.net/aarch64-k3.10/installer/opkg -o "$RUNNER_TEMP/entware-opkg"
          printf '%s  %s\n' 4095ae3e7364a9553811ddea90c11ca44a9e9b54f15c200b6c20fd1525ffcbd2 "$RUNNER_TEMP/entware-opkg" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/entware-opkg"
      - name: Full panel self-update cycle on disposable aarch64 VM (not router or firmware acceptance)
        run: |
          sudo env KAS_SERVICE_LAB=1 GITHUB_ACTIONS=true \
            sh tests/test_panel_selfupdate_service.sh \
            "$RUNNER_TEMP/kas-panel-old" "$RUNNER_TEMP/kas-panel-new" \
            "$RUNNER_TEMP/entware-opkg" "$SOURCE_SHA" \
            "$RUNNER_TEMP/kas-panel-stable"
  crossbuild:
    # Manual-only: expensive native/IPK release qualification, not PR smoke.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [package-tests, service-lifecycle, selfupdate-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64-3.10, armv7-3.2, mipsel-3.4, mips-3.4]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: web/control-center/go.sum
      - name: Build source-pinned experimental IPK (no installation or release)
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 web/control-center/packaging/build-ipk.py \
            --arch "$PACKAGE_ARCH" --version "0.0.1~test${GITHUB_RUN_NUMBER}.${SOURCE_SHA:0:12}-1" \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/ipk"
          cd "$RUNNER_TEMP/ipk"
          sha256sum ./*.ipk > SHA256SUMS
          sha256sum -c SHA256SUMS
          set -- "$RUNNER_TEMP"/ipk/*.ipk
          PACKAGE_FILE=$1
          (cd "$GITHUB_WORKSPACE/web/control-center" && KAS_TEST_PANEL_IPK="$PACKAGE_FILE" KAS_TEST_PANEL_ARCH="$PACKAGE_ARCH" go test -count=1 -run '^TestPanelActualBuiltIPKMatchesGeneratedIndex$' -v .)
          tar xzf ./*.ipk ./data.tar.gz
          tar xzf data.tar.gz
          go version -m opt/bin/kas-control-center | tee BUILD_INFO
          grep -F 'CGO_ENABLED=0' BUILD_INFO
          if [ "$PACKAGE_ARCH" = mipsel-3.4 ] || [ "$PACKAGE_ARCH" = mips-3.4 ]; then
            grep -F 'GOMIPS=softfloat' BUILD_INFO
          fi
          readelf -h opt/bin/kas-control-center | tee ELF_INFO
          case "$PACKAGE_ARCH" in
            aarch64-3.10) grep -F 'AArch64' ELF_INFO; grep -F 'ELF64' ELF_INFO;;
            armv7-3.2) grep -F 'ARM' ELF_INFO; grep -F 'ELF32' ELF_INFO; grep -F 'GOARM=7' BUILD_INFO;;
            mipsel-3.4) grep -F 'MIPS' ELF_INFO; grep -F 'little endian' ELF_INFO;;
            mips-3.4) grep -F 'MIPS' ELF_INFO; grep -F 'big endian' ELF_INFO;;
          esac
          rm -rf opt
      - uses: actions/upload-artifact@v4
        with:
          name: kas-control-center-ipk-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/ipk/*.ipk
            ${{ runner.temp }}/ipk/SHA256SUMS
            ${{ runner.temp }}/ipk/BUILD_INFO
          if-no-files-found: error
          retention-days: 14
