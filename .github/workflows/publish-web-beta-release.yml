name: Publish KAS WEB beta.N Release (owner GO only)

# RELEASE-ONLY. Never builds IPKs, updates Pages, installs on a router,
# creates legacy aliases, or changes the KAS Core Latest release.
# Owner must authorize GO PUBLISH separately from GO PAGES.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Internal package version, e.g. 0.1.0.beta.5-1'
        required: true
        type: string
      previous_version:
        description: 'Previous internal package version, e.g. 0.1.0.beta.4-1'
        required: true
        type: string
      tag:
        description: 'Canonical prerelease tag, e.g. v0.1.0-beta.5'
        required: true
        type: string
      previous_tag:
        description: 'Existing published WEB prerelease, e.g. v0.1.0-beta.4'
        required: true
        type: string
      verified_run:
        description: 'Successful explicit candidate-build workflow_dispatch run ID'
        required: true
        type: string
      source_sha:
        description: 'Full 40-character SHA of the source built by that run'
        required: true
        type: string
      artifact_prefix:
        description: 'Exact candidate artifact prefix, e.g. kas-web-beta5'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kas-web-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'saymer-alt/keenetic-auto-setup' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Obtain SHA256-pinned real Entware opkg comparator
        env:
          KAS_PUBLISH_OPKG: ${{ runner.temp }}/entware-opkg
        shell: bash
        run: |
          set -euo pipefail
          # Same bounded-retry budget as the candidate ladder: a slow
          # Entware mirror is an infra condition, not a publish refusal.
          curl --fail --location --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://bin.entware.net/x64-k3.2/installer/opkg -o "$KAS_PUBLISH_OPKG"
          printf '%s  %s\n' 08c8feb2ef3153f025ba687f8df02adf915e4252a3605cc6798f8d105162cb38 "$KAS_PUBLISH_OPKG" | sha256sum -c -
          chmod 700 "$KAS_PUBLISH_OPKG"
      - name: Verify candidate, resume draft or publish verified Release only
        shell: bash
        env:
          KAS_PUBLISH_OPKG: ${{ runner.temp }}/entware-opkg
          VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          set -euo pipefail
          python3 scripts/kas_web_beta_publisher.py \
            --version "$VERSION" \
            --previous-version "$PREVIOUS_VERSION" \
            --tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --verified-run "$VERIFIED_RUN" \
            --source-sha "$SOURCE_SHA" \
            --artifact-prefix "$ARTIFACT_PREFIX"
