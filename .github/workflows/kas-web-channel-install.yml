name: Web channel installer regression

on:
  pull_request:
    paths:
      - kas-web-install.sh
      - tests/kas-web-channel-install-regression.py
      - .github/workflows/kas-web-channel-install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-channel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and mock tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq busybox
          sh -n kas-web-install.sh
          busybox ash -n kas-web-install.sh
          python3 tests/kas-web-channel-install-regression.py
