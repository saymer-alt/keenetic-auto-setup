name: KAS Web official candidate IPKs (no publication)

on:
  push:
    branches:
      - main # after merge: automatic verification only; official candidates are explicitly dispatched
    paths:
      - '.github/workflows/kas-web-candidate-build.yml'
      - 'web/control-center/**'
      - '!web/control-center/**/*.md'
  workflow_dispatch:
    # The single reusable beta-agnostic candidate builder. A release
    # candidate is produced ONLY by this explicit dispatch with all four
    # confirmed parameters; the publisher accepts nothing else. Push events
    # run the verification suite but build no artifacts, so an automatic
    # run can never masquerade as an official release candidate.
    inputs:
      version:
        description: 'Internal IPK version, e.g. 0.1.0.beta.6-1 (dotted, no tilde)'
        required: true
        type: string
      tag:
        description: 'Canonical release tag, e.g. v0.1.0-beta.6'
        required: true
        type: string
      artifact_prefix:
        description: 'Uploaded artifact name prefix, e.g. kas-web-beta6'
        required: true
        type: string
      previous_version:
        description: 'Previous published Web IPK version, e.g. 0.1.0.beta.5-1'
        required: true
        type: string

permissions:
  contents: read

# Cancel superseded push verification; never cancel an explicitly dispatched
# official candidate build.
concurrency:
  group: kas-web-candidate-build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Dispatch: the explicitly confirmed release pair. Push has no inputs
      # context, so the ladder runs on an EVERGREEN placeholder pair: a pure
      # compare-versions semantics regression that stays valid regardless of
      # what is published and never claims a release. Do NOT use tilde forms:
      # 0.1.0~beta.N-1 sorts OLDER than the dotted prereleases.
      # The eventual stable must sort above the dotted prereleases (0.1.1-1).
      # compare-versions rejects equal versions.
      VERSION: ${{ inputs.version || '0.1.0.beta.9-1' }}
      PREVIOUS_VERSION: ${{ inputs.previous_version || '0.1.0.beta.8-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: web/control-center/go.sum
      - name: Package, index and update version tests
        run: |
          set -euo pipefail
          python3 tests/test_ipk.py -v
          python3 tests/test_panel_manifest.py -v
          (cd web/control-center && go generate ./... && go test -count=1 ./...)
      - name: Real Entware opkg ladder (release pair → future stable)
        run: |
          set -euo pipefail
          # Shared Entware mirror can be slow from CI (observed ~13 KB/s);
          # a timed-out download is an infra failure, not a version-ladder
          # failure, so budget a bounded retry instead of a bare 60s cap.
          # Verify pinned Entware digest and ELF identity before use.
          scripts/verify-entware-opkg.sh --output "$RUNNER_TEMP/entware-opkg"
          chmod 700 "$RUNNER_TEMP/entware-opkg"
          mkdir -p "$RUNNER_TEMP/offline/opt/tmp"
          printf 'dest root /opt\n' > "$RUNNER_TEMP/offline/opkg.conf"
          opkg="$RUNNER_TEMP/entware-opkg"
          args=(-f "$RUNNER_TEMP/offline/opkg.conf" --offline-root "$RUNNER_TEMP/offline" --tmp-dir "$RUNNER_TEMP/offline/opt/tmp" compare-versions)
          "$opkg" "${args[@]}" "$VERSION" '>>' "$PREVIOUS_VERSION"
          "$opkg" "${args[@]}" '0.1.1-1' '>>' "$VERSION"
          if "$opkg" "${args[@]}" "$PREVIOUS_VERSION" '>>' "$VERSION"; then
            echo "ERROR: $PREVIOUS_VERSION is not older than $VERSION" >&2; exit 1
          fi
          if "$opkg" "${args[@]}" "$VERSION" '>>' '0.1.1-1'; then
            echo "ERROR: $VERSION is not older than future stable 0.1.1-1" >&2; exit 1
          fi

  crossbuild:
    needs: metadata-tests
    # Artifacts exist only for an explicitly dispatched candidate. A push run
    # must never upload packages that could be mistaken for a release
    # candidate without the confirmed version/tag/prefix parameters.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64-3.10, armv7-3.2, mipsel-3.4, mips-3.4]
    env:
      SOURCE_SHA: ${{ github.sha }}
      BETA_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: web/control-center/go.sum
      - name: Build official beta-version IPK from exact clean source (NO publish/install)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 web/control-center/packaging/build-ipk.py \
            --arch "$PACKAGE_ARCH" --version "$BETA_VERSION" --channel experimental \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/ipk"
          cd "$RUNNER_TEMP/ipk"
          sha256sum ./*.ipk > SHA256SUMS
          sha256sum -c SHA256SUMS
          set -- ./*.ipk
          test "$#" -eq 1
          echo "Built $1"
          PACKAGE_FILE="$RUNNER_TEMP/ipk/${1#./}"
          (cd "$GITHUB_WORKSPACE/web/control-center" && KAS_TEST_PANEL_IPK="$PACKAGE_FILE" KAS_TEST_PANEL_ARCH="$PACKAGE_ARCH" go test -count=1 -run '^TestPanelActualBuiltIPKMatchesGeneratedIndex$' -v .)
          # Canonical beta release tag for the experimental index, plus the
          # legacy alias tag exercised only as a parser fallback (installed
          # beta.1 panels); publication creates no alias release.
          python3 "$GITHUB_WORKSPACE/web/control-center/packaging/update-manifest.py" \
            --channel experimental --tag "$RELEASE_TAG" "$PACKAGE_FILE" > "$RUNNER_TEMP/ipk/manifest-canonical.json"
          python3 "$GITHUB_WORKSPACE/web/control-center/packaging/update-manifest.py" \
            --channel experimental --tag "kas-web-ipk-${SOURCE_SHA:0:7}" "$PACKAGE_FILE" > "$RUNNER_TEMP/ipk/manifest-alias.json"
          python3 - <<'PY'
          import json,os,pathlib
          canonical=json.load(open(os.environ['RUNNER_TEMP']+'/ipk/manifest-canonical.json'))
          alias=json.load(open(os.environ['RUNNER_TEMP']+'/ipk/manifest-alias.json'))
          for p in (canonical,alias):
              assert p['channel']=='experimental' and len(p['packages'])==1
              x=p['packages'][0]
              assert x['version']==os.environ['BETA_VERSION']
              assert x['source_sha']==os.environ['SOURCE_SHA']
              assert x['architecture']==os.environ['PACKAGE_ARCH']
              assert x['sha256'] and x['binary_sha256']
          assert canonical['tag']==os.environ['RELEASE_TAG'] and alias['tag'].startswith('kas-web-ipk-')
          print('PASS beta version, source SHA, architecture and digest (canonical + alias index)')
          PY
          mkdir -p inspect
          (cd inspect && tar xzf "$PACKAGE_FILE" ./data.tar.gz && tar xzf data.tar.gz && go version -m opt/bin/kas-control-center > BUILD_INFO && readelf -h opt/bin/kas-control-center > ELF_INFO)
          grep -F 'CGO_ENABLED=0' inspect/BUILD_INFO
          case "$PACKAGE_ARCH" in
            aarch64-3.10) grep -F 'AArch64' inspect/ELF_INFO; grep -F 'ELF64' inspect/ELF_INFO;;
            armv7-3.2) grep -F 'ARM' inspect/ELF_INFO; grep -F 'ELF32' inspect/ELF_INFO; grep -F 'GOARM=7' inspect/BUILD_INFO;;
            mipsel-3.4) grep -F 'MIPS' inspect/ELF_INFO; grep -F 'little endian' inspect/ELF_INFO; grep -F 'GOMIPS=softfloat' inspect/BUILD_INFO;;
            mips-3.4) grep -F 'MIPS' inspect/ELF_INFO; grep -F 'big endian' inspect/ELF_INFO; grep -F 'GOMIPS=softfloat' inspect/BUILD_INFO;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/ipk/*.ipk
            ${{ runner.temp }}/ipk/SHA256SUMS
            ${{ runner.temp }}/ipk/manifest-canonical.json
            ${{ runner.temp }}/ipk/manifest-alias.json
          if-no-files-found: error
          retention-days: 21
