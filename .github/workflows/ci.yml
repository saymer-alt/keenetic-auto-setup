name: CI

on:
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main
      - stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Shell contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "sh -n $file"
            sh -n "$file"
          done < <(git ls-files '*.sh')
          echo "sh -n S00ubifs"
          sh -n S00ubifs

      - name: BusyBox shell
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
          git ls-files '*.sh' | while IFS= read -r file; do busybox ash -n "$file"; done
          busybox ash -n S00ubifs

      - name: Lifecycle behavioural regression (dash and BusyBox ash)
        run: python3 tests/lifecycle-regression.py
      - name: Watchdog incident diagnostics regression (dash and BusyBox ash)
        run: python3 tests/watchdog-diagnostics-regression.py

      - name: Contract smoke test
        run: sh tests/contracts.sh

      - name: Owner experience — safe first-run errors
        run: python3 tests/owner-experience-gate.py

      - name: First-fetch bootstrap mocked-network and BusyBox acceptance
        run: python3 tests/bootstrap-regression.py

      - name: First-fetch README command offline shell regression
        run: python3 tests/bootstrap-readme-regression.py

      - name: Internal wget fallback timeout and cleanup regression
        run: python3 tests/setup-wget-regression.py

      - name: Ownership journal atomicity and old-install regression (sh/BusyBox ash)
        run: python3 tests/ownership-ledger-regression.py

      - name: Minimal OPKG package removal regression (sh and BusyBox ash)
        run: python3 tests/uninstall-packages-regression.py

      - name: Native service stop and package removal regression (sh and BusyBox ash)
        run: python3 tests/uninstall-packages-service-regression.py

      - name: Config import PTY reader regression (dash and BusyBox ash)
        run: python3 tests/config-import-pty-regression.py .

      # Issue #320 backport: full-script E2E as root exercises the
      # recovery import, .bak protection, config.yaml.invalid[.N]
      # preservation (atomic no-clobber ln) and R13-R20 contracts.
      - name: Config import full-script recovery E2E (root, disposable /opt)
        run: sudo python3 tests/config-import-pty-regression.py .

      - name: Mihomo updater opkg-staleness warning regression (dash and BusyBox ash)
        run: python3 tests/update-opkg-staleness-regression.py

      # Issue #320 backport: proves the stale-opkg-database downgrade
      # mechanism with the pinned official Entware opkg (offline root).
      - name: OPKG downgrade repro (pinned official Entware opkg, offline root)
        run: |
          curl --fail --location --connect-timeout 15 --max-time 60 \
            https://bin.entware.net/x64-k3.2/installer/opkg -o "$RUNNER_TEMP/entware-opkg"
          printf '%s  %s\n' 08c8feb2ef3153f025ba687f8df02adf915e4252a3605cc6798f8d105162cb38 "$RUNNER_TEMP/entware-opkg" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/entware-opkg"
          sudo chown 0:0 "$RUNNER_TEMP/entware-opkg"
          sudo env KAS_TEST_OPKG="$RUNNER_TEMP/entware-opkg" \
            python3 tests/test_opkg_downgrade_repro.py -v

      # Issue #159 backport: exposure audit honors the owner Controller
      # contract (empty/YAML-null secret and open Controller are accepted).
      - name: Exposure audit regression (dash and BusyBox ash)
        run: python3 tests/exposure-check-regression.py

      - name: Mihomo init S28/S99 resolution contract regression (issue #355)
        run: |
          sudo python3 tests/mihomo-init-contract-regression.py
          python3 tests/mihomo-init-safety-regression.py

      - name: Transaction invariants
        run: python3 tests/transaction-invariants.py

      - name: Rollback fault regression (dash and BusyBox ash)
        run: python3 tests/rollback-regression.py

      - name: Config import expected-source gate regression (dash and BusyBox ash)
        run: python3 tests/config-import-filter-gate-regression.py

      - name: Doctor service-init classification (dash and BusyBox ash)
        run: python3 tests/doctor-init-regression.py

      - name: Doctor Netfilter chain classification (dash and BusyBox ash)
        run: |
          sh tests/doctor-netfilter-probe-regression.sh .
          busybox ash tests/doctor-netfilter-probe-regression.sh .

      - name: Optional Network Doctor regression (dash and BusyBox ash)
        run: python3 tests/network-doctor-regression.py

      - name: Optional router sys-metrics regression (dash and BusyBox ash)
        run: python3 tests/sys-metrics-regression.py

      - name: Downloader partial-transfer regression (dash and BusyBox ash)
        run: python3 tests/download-regression.py

      - name: Process discovery and KAS-SAFETY-001 executable policy matrix (dash and BusyBox ash)
        run: |
          python3 tests/process-regression.py
          python3 tests/swap-regression.py

      - name: Local Markdown links
        run: python3 tests/docs-links.py

      - name: Maintenance audit regressions (dash and BusyBox ash)
        run: python3 tests/maintenance-regression.py

      - name: Mihomo rolling-feed selection (dash and BusyBox ash)
        run: |
          python3 tests/ipk-selection-regression.py
          python3 tests/ipk-package-release-regression.py

      - name: Whitespace
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
                git show --check --oneline "${{ github.sha }}"
              else
                git diff --check "$before..${{ github.sha }}"
              fi
              ;;
            *)
              git show --check --oneline "${{ github.sha }}"
              ;;
          esac
