name: CI

on:
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main
      - stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Shell contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agent instruction and context contracts
        run: python3 tests/agent-instructions-regression.py

      # POC is not yet present on stable; keep this stdlib/mock-only regression
      # scoped to branches that actually contain the opt-in POC.
      - name: Agent orchestration POC safety (no network or model)
        if: ${{ hashFiles('scripts/orchestration-poc/kas_orchestrate.py') != '' }}
        run: python3 -m unittest discover -s scripts/orchestration-poc/tests -v

      # Separate mock-only exclusive-lease suite. No GitHub API or LLM calls.
      - name: Agent orchestration lease safety (no network or model)
        if: ${{ hashFiles('scripts/orchestration-lease/tests/test_claim_lease.py') != '' }}
        run: python3 -m unittest discover -s scripts/orchestration-lease/tests -v

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "sh -n $file"
            sh -n "$file"
          done < <(git ls-files '*.sh')
          echo "sh -n S00ubifs"
          sh -n S00ubifs

      - name: BusyBox shell
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
          git ls-files '*.sh' | while IFS= read -r file; do busybox ash -n "$file"; done
          busybox ash -n S00ubifs

      - name: Lifecycle behavioural regression (dash and BusyBox ash)
        run: python3 tests/lifecycle-regression.py
      - name: Watchdog incident diagnostics regression (dash and BusyBox ash)
        run: python3 tests/watchdog-diagnostics-regression.py
      - name: Unified KAS Core updater regression (dash and BusyBox ash)
        run: |
          git fetch origin --no-tags \
            'refs/tags/v1.8.6:refs/tags/v1.8.6' \
            'refs/tags/v1.8.7:refs/tags/v1.8.7'
          python3 tests/kas-update-regression.py

      - name: Stable release gate workflow contract
        run: python3 tests/stable-release-gate-regression.py

      - name: Contract smoke test
        run: sh tests/contracts.sh

      - name: Owner experience — safe first-run errors
        run: python3 tests/owner-experience-gate.py

      # The one-shot beta.2/beta.3/beta.4 publisher and legacy-switch workflows
      # and their dry-run suites were retired on 2026-11-02 after the staged
      # beta.4 publication completed (docs/github-cleanup-plan-20261030.md);
      # tests/_publication_testkit.py keeps the shared fixtures alive.

      - name: Pages deploy dry-run (mock GitHub and Pages, real step scripts)
        run: python3 tests/pages-deploy-dryrun.py

      - name: Reusable WEB Release publisher dry-run (offline, no GitHub mutations)
        run: python3 tests/web-beta-publish-dryrun.py

      - name: Candidate-build dry-run (real beta.4 artifacts, build-ipk --binary)
        run: python3 tests/candidate-build-dryrun.py

      - name: First-fetch bootstrap mocked-network and BusyBox acceptance
        run: python3 tests/bootstrap-regression.py

      - name: First-fetch README command offline shell regression
        run: python3 tests/bootstrap-readme-regression.py

      - name: Internal wget fallback timeout and cleanup regression
        run: python3 tests/setup-wget-regression.py
      - name: Small-transfer download resilience and classification regression
        run: python3 tests/install-magitrickle-download-regression.py

      - name: Ownership journal atomicity and old-install regression (sh/BusyBox ash)
        run: python3 tests/ownership-ledger-regression.py

      - name: Doctor Mihomo init classification (dash and BusyBox ash)
        run: python3 tests/doctor-init-regression.py

      - name: MagiTrickle post-install runtime health regression (issue #427)
        run: python3 tests/magitrickle-runtime-regression.py

      - name: Uninstall read-only preflight and blocked removal regression
        run: python3 tests/uninstall-audit-regression.py

      - name: Minimal OPKG-only partial uninstall regression (sh and BusyBox ash)
        run: python3 tests/uninstall-packages-regression.py

      - name: Native service stop and simple uninstall regression (sh and BusyBox ash)
        run: python3 tests/uninstall-packages-service-regression.py

      - name: Config import PTY reader regression (dash and BusyBox ash)
        run: python3 tests/config-import-pty-regression.py .

      - name: Config import full-script recovery E2E (root, disposable /opt)
        run: sudo python3 tests/config-import-pty-regression.py .

      - name: Mihomo updater opkg-staleness warning regression (dash and BusyBox ash)
        run: python3 tests/update-opkg-staleness-regression.py

      - name: Mihomo init S28/S99 resolution contract regression (issue #355)
        run: |
          sudo python3 tests/mihomo-init-contract-regression.py
          python3 tests/mihomo-init-safety-regression.py

      - name: Entware/BusyBox preflight regression (issue #356, read-only)
        run: sudo python3 tests/busybox-preflight-regression.py

      - name: Transaction invariants
        run: python3 tests/transaction-invariants.py

      - name: Rollback fault regression (dash and BusyBox ash)
        run: python3 tests/rollback-regression.py

      - name: Config import expected-source gate regression (dash and BusyBox ash)
        run: python3 tests/config-import-filter-gate-regression.py

      - name: Network Doctor staged diagnostic regression (dash and BusyBox ash)
        run: python3 tests/network-doctor-regression.py

      - name: Router sys-metrics collector regression (dash and BusyBox ash)
        run: python3 tests/sys-metrics-regression.py

      - name: Downloader partial-transfer regression (dash and BusyBox ash)
        run: python3 tests/download-regression.py

      - name: Exposure audit regression (dash and BusyBox ash)
        run: python3 tests/exposure-check-regression.py
      - name: Download reachability diagnostic regression (dash and BusyBox ash)
        run: python3 tests/download-check-regression.py

      - name: Process discovery and KAS-SAFETY-001 executable policy matrix (dash and BusyBox ash)
        run: |
          python3 tests/process-regression.py
          python3 tests/swap-regression.py

      - name: Doctor MagiTrickle scope (dash and BusyBox ash)
        run: |
          sh tests/doctor-mt-scope-regression.sh .
          busybox ash tests/doctor-mt-scope-regression.sh .
      - name: Doctor MagiTrickle effective netfilter (dash and BusyBox ash)
        run: |
          sh tests/doctor-mt-netfilter-regression.sh .
          busybox ash tests/doctor-mt-netfilter-regression.sh .
      - name: Doctor native OpkgTunN observation (dash and BusyBox ash)
        run: |
          sh tests/doctor-native-tun-regression.sh .
          busybox ash tests/doctor-native-tun-regression.sh .

      - name: Local Markdown links
        run: python3 tests/docs-links.py

      - name: Maintenance audit regressions (dash and BusyBox ash)
        run: python3 tests/maintenance-regression.py

      - name: Mihomo rolling-feed selection (dash and BusyBox ash)
        run: |
          python3 tests/ipk-selection-regression.py
          python3 tests/ipk-package-release-regression.py
          python3 tests/doctor-package-selection-regression.py

      - name: Whitespace
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
                git show --check --oneline "${{ github.sha }}"
              else
                git diff --check "$before..${{ github.sha }}"
              fi
              ;;
            *)
              git show --check --oneline "${{ github.sha }}"
              ;;
          esac
