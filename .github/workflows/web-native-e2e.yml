name: KAS Web native ARM64 import E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'mihomo-doctor.sh'
      - '.github/workflows/web-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-import:
    # bdab4864: fixed deny categories for the managed service start.
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@9c9e75cb7641ee1f75a913f0c4b5e0d4bca61a04
    with:
      emulator_ref: 9c9e75cb7641ee1f75a913f0c4b5e0d4bca61a04
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web
