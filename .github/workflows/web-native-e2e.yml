name: KAS Web native ARM64 import E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'mihomo-doctor.sh'
      - '.github/workflows/web-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-import:
    # bdab4864: fixed deny categories for the managed service start.
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@324f7a153d96eeea0e3221b74819b5c65c8b1e79
    with:
      emulator_ref: 324f7a153d96eeea0e3221b74819b5c65c8b1e79
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web
