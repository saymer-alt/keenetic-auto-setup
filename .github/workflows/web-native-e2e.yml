name: KAS Web native ARM64 import E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'mihomo-doctor.sh'
      - '.github/workflows/web-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-import:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@8044fb6777b80b90fca3df67972175ef050bf269
    with:
      emulator_ref: 8044fb6777b80b90fca3df67972175ef050bf269
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web
