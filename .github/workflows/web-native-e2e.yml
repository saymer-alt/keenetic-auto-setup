name: KAS Web native ARM64 import E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'mihomo-doctor.sh'
      - '.github/workflows/web-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-import:
    # e1c86a0c: panel port from guest evidence + fixed smoke guard probe
    # strings (adjacent literals must not swallow curl -w via % formatting).
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@e1c86a0df87475443d8dc11965e2e04440c4c6cc
    with:
      emulator_ref: e1c86a0df87475443d8dc11965e2e04440c4c6cc
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web
