name: KAS Web native ARM64 import E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'mihomo-doctor.sh'
      - '.github/workflows/web-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-import:
    # 4dda865c: lab derives the managed panel port from guest evidence
    # (beta.6 default 18080 with bounded fallback; beta.5 probes kept).
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@4dda865c3647facb1ad1ee2881d4a44172f181d9
    with:
      emulator_ref: 4dda865c3647facb1ad1ee2881d4a44172f181d9
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web
