name: Publish KN-1010 Web test bundle

on:
  push:
    branches:
      - publish/kas-web-kn1010-ui-66ab147
    paths:
      - '.github/workflows/web-kn1010-prerelease.yml'

permissions:
  contents: read

concurrency:
  group: kas-web-kn1010-ui-66ab147-publication
  cancel-in-progress: false

jobs:
  publish-test-bundle:
    if: github.repository == 'saymer-alt/keenetic-auto-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 66ab147bb6c1526f7317239b0543968b8ea6623f
      TAG: kas-web-kn1010-ui-66ab147
      ARCHIVE: kas-web-kn1010-ui-66ab147.tar.gz
    steps:
      - name: Retrieve the already tested artifact (no rebuild)
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/40697645736 --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/40697645736 --jq '.conclusion')" = success
          gh run download 40697645736 --name "kas-web-kn1010-$SOURCE_SHA" --dir bundle
          cd bundle
          sha256sum -c SHA256SUMS
          grep -Fx "KAS_SOURCE_SHA=$SOURCE_SHA" BUILD_INFO
          grep -F 'GOARCH=mipsle' BUILD_INFO
          grep -F 'GOMIPS=softfloat' BUILD_INFO
      - name: Pack the unchanged artifact files
        run: |
          set -euo pipefail
          tar -czf "$ARCHIVE" -C bundle kas-control-center-mipsle kas-web-manage.sh BUILD_INFO KN1010_TEST.md SHA256SUMS
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
      - name: Publish explicitly requested prerelease (never latest)
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Тестовый комплект KAS Web для Keenetic KN-1010 (MIPSel softfloat).
          Две кнопки фильтра: Исключить выбранные и Снять фильтр, с подтверждением без отдельного шага применения.
          Исправлено определение установленного magitrickled; индикация остаётся проверкой наличия файла.
          Home-only ограничение выключено по умолчанию: доступ из SSTP/L2TP и других подсетей определяется firewall/маршрутами KeeneticOS.
          Ограничение можно включить в панели; настройка сохраняется. Слушатель остаётся на адресе Home, без wildcard/WAN-привязки.
          Исходная ревизия: 66ab147bb6c1526f7317239b0543968b8ea6623f, Draft PR #263.
          Комплект перенесён из успешного Actions artifact 40697645736 без пересборки.
          Архив содержит панель, установочный скрипт, BUILD_INFO, инструкцию и SHA256SUMS.
          Это аппаратная тестовая сборка, не стабильный релиз и не подтверждение приёмки KN-1010.
          Тег указывает на коммит публикации; исходная ревизия бинарника отдельно закреплена выше и в BUILD_INFO.
          main/stable не изменяются; автоматической установки нет.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "KAS Web: KN-1010 UI test 66ab147" --notes-file release-notes.md "$ARCHIVE" "$ARCHIVE.sha256"
