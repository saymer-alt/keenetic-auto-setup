name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@6d872d74c942c5b51a17f0643a273e637cf26f2d
    with:
      emulator_ref: 6d872d74c942c5b51a17f0643a273e637cf26f2d
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
