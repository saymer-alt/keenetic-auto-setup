name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@a8c87a691ba537c81ac2390a6b3e0572df55c6d3
    with:
      emulator_ref: a8c87a691ba537c81ac2390a6b3e0572df55c6d3
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
