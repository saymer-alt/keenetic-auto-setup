name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@f0b22b1f27b634bdc15ef8076950f1fbbb13ef77
    with:
      emulator_ref: f0b22b1f27b634bdc15ef8076950f1fbbb13ef77
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
