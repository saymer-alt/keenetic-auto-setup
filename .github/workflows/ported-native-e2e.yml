name: Keenetic Ported native KAS E2E

on:
  pull_request:
    # Native E2E is expensive. Ignore only PRs whose every changed file is
    # documentation, issue templates, or the advisory Core Sync Guard metadata
    # blob; any change to scripts, tests, fixtures or workflow CI still runs it.
    # config/core-sync-baseline.json is consumed only by the dedicated
    # core-sync-guard workflow (offline regression + live blob comparison);
    # the router lifecycle E2E never reads it (issue #214, observed on #389:
    # a single-JSON metadata PR paid a 14m48s native-kas run for no signal).
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'config/core-sync-baseline.json'
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string
      stage:
        description: 'Laboratory stage (manual runs only); PRs always test kas lifecycle'
        required: true
        type: choice
        default: kas
        options:
          - kas
          - uninstall-packages
          - kas-update

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@1e163c2041f137a25380802872f6d138f936d452
    with:
      emulator_ref: 1e163c2041f137a25380802872f6d138f936d452
      # ISSUE #465 ONE-OFF FORENSIC PR ONLY — DO NOT MERGE INTO main.
      # Hold KAS source fixed at the failed #458 exact head while changing ONLY
      # the emulator with sanitized FOREIGN_REBOOT_* phase markers.
      kas_ref: 382cd6d92b0f5e06bdc712e35ec8faba3d3963d7
      # PRs keep the established full lifecycle; only manual dispatch opts into removal.
      stage: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'kas' }}
