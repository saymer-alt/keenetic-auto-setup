name: Keenetic Ported native KAS E2E

on:
  pull_request:
    # Native E2E is expensive. Ignore only documentation/issue-template-only PRs;
    # any change to scripts, tests, fixtures or workflow CI still runs it.
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string
      stage:
        description: 'Laboratory stage (manual runs only); PRs always test kas lifecycle'
        required: true
        type: choice
        default: kas
        options:
          - kas
          - uninstall-packages

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@1abea236920bd33f61a81975ecc4b52a9825f5ef
    with:
      emulator_ref: 1abea236920bd33f61a81975ecc4b52a9825f5ef
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
      # PRs keep the established full lifecycle; only manual dispatch opts into removal.
      # TEMPORARY acceptance of the real KAS reusable caller; never merge this PR.
      stage: uninstall-packages
