name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@cbe0ed49c795a230a790f1eb5c6871a4140adefc
    with:
      emulator_ref: cbe0ed49c795a230a790f1eb5c6871a4140adefc
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
