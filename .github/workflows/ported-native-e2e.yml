name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@cf1556428efa7924c92e70a3e387b48ce1e8195d
    with:
      emulator_ref: cf1556428efa7924c92e70a3e387b48ce1e8195d
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
