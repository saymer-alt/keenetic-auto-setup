name: Keenetic Ported native KAS E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kas_ref:
        description: Full KAS commit SHA (empty selects this dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ported-kas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kas:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@44c6cab9d50fcd33147ac0a3a193a5a985710796
    with:
      emulator_ref: 44c6cab9d50fcd33147ac0a3a193a5a985710796
      kas_ref: ${{ github.event.pull_request.head.sha || inputs.kas_ref || github.sha }}
