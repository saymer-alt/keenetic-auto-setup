name: KAS Web native ARM64 exclude-filter E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'tests/fixtures/filter-e2e-provider-a.yaml'
      - 'tests/fixtures/filter-e2e-provider-b.yaml'
      - '.github/workflows/web-filter-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-filter-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-filter:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@eba8ab9f4216cfd8ce7634795d491fb2ca146178
    with:
      emulator_ref: eba8ab9f4216cfd8ce7634795d491fb2ca146178
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web-filter
