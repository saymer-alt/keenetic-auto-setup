name: KAS Web native ARM64 exclude-filter E2E (experimental)

on:
  pull_request:
    paths:
      - 'web/control-center/**'
      - 'config-import.sh'
      - 'tests/fixtures/filter-e2e-provider-a.yaml'
      - 'tests/fixtures/filter-e2e-provider-b.yaml'
      - '.github/workflows/web-filter-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kas-web-filter-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web-filter:
    uses: saymer-alt/router-emulator/.github/workflows/ported-entware-kas.yml@9c9e75cb7641ee1f75a913f0c4b5e0d4bca61a04
    with:
      emulator_ref: 9c9e75cb7641ee1f75a913f0c4b5e0d4bca61a04
      kas_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      stage: web-filter
